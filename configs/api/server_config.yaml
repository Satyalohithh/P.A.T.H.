# API server configuration.

server:
  host: 0.0.0.0
  port: 8000
  workers: 1
  log_level: info
  reload: false

cors:
  allowed_origins: ["*"]

auth:
  mode: disabled    # disabled | jwt | api_key
  token_ttl_seconds: 3600

websocket:
  path: /ws
  ping_interval_seconds: 20
  max_connections: 1024

limits:
  max_streams: 8
  max_frame_rate_per_stream: 30
  max_payload_bytes: 10485760