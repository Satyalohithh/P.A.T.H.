# Phase 2 training configuration: temporal sequence models on frame-level features.

run:
  name: phase2_temporal
  tracking-uri: configs/experiment/mlflow_tracking.yaml

data:
  splits: datasets/splits/{train,val,test}.json
  dataset_version: v2
  sequence_cache: datasets/processed/sequences.parquet

features:
  config: configs/features/pose_features.yaml
  config_interaction: configs/features/interaction_features.yaml
  config_motion: configs/features/motion_features.yaml
  window_frames: 30

model:
  config: configs/models/bilstm_attention.yaml
  fallback_candidates:
    - configs/models/temporal_cnn.yaml
    - configs/models/temporal_transformer.yaml

training:
  random_state: 42
  epochs: 150
  batch_size: 64
  device: cuda
  target_metric: macro_f1
  early_stopping_patience: 15

artifacts:
  output_dir: models/checkpoints/phase2
  save_top_k: 5