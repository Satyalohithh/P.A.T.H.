[project]
name = "safewatch-ai"
version = "0.1.0"
description = "SafeWatch AI: context-aware aggression detection distinguishing normal, playful, suspicious, and aggressive human interactions from pose dynamics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SafeWatch AI Team" }]
keywords = [
  "computer-vision",
  "pose-estimation",
  "multi-object-tracking",
  "video-understanding",
  "behavior-understanding",
  "surveillance",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
  "alembic>=1.13",
  "dvc>=3.48",
  "fastapi>=0.111",
  "lightgbm>=4.3",
  "matplotlib>=3.8",
  "mlflow>=2.13",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pandas>=2.2",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "scipy>=1.13",
  "shap>=0.45",
  "sqlalchemy>=2.0",
  "torch>=2.2",
  "ultralytics>=8.2",
  "uvicorn[standard]>=0.30",
  "websockets>=12.0",
  "xgboost>=2.0",
]

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safewatch"]