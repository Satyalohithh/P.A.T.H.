[metadata]
name = safewatch-ai
version = 0.1.0
description = SafeWatch AI: context-aware aggression detection from pose dynamics.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = SafeWatch AI Team

[ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4"]

[ruff.isort]
known-first-party = ["safewatch"]

[mypy]
python_version = 3.11
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool:pytest]
testpaths = ["tests"]
addopts = "-ra -q"

[coverage:run]
branch = true
source = safewatch

[coverage:report]
show_missing = true